# Chọi Dép on a server that already runs a shared reverse proxy on ports 80/443 (one Caddy for several
# sites, like the Peti VPS). The proxy forwards choidep.peti.vn to 127.0.0.1:${APP_PORT} (deploy/choidep.caddy).
name: choidep

services:
  app:
    build: .
    restart: unless-stopped
    # On a shared server, pick a uid no other project or host user owns, so only this app can read data/.
    user: "${APP_UID:-1000}:${APP_UID:-1000}"
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1" # only the local proxy reaches the app; it sets X-Forwarded-For
      DB_PATH: /app/data/choidep.sqlite
    volumes:
      - ./data:/app/data # SQLite: daily counters and site settings — back this up
    ports:
      - "127.0.0.1:${APP_PORT:-3201}:3000" # loopback only, never reachable from the internet
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
