<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Same checkered flag tile as the .brand-flag logo in the header -->
  <defs>
    <clipPath id="tile"><rect x="5" y="5" width="54" height="54" rx="14"/></clipPath>
    <pattern id="checks" width="18" height="18" patternUnits="userSpaceOnUse" x="5" y="5">
      <rect width="18" height="18" fill="#fff"/>
      <rect width="9" height="9" fill="#1d1a2f"/>
      <rect x="9" y="9" width="9" height="9" fill="#1d1a2f"/>
    </pattern>
  </defs>
  <rect x="9" y="9" width="54" height="54" rx="14" fill="#ff5a36"/>
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#checks)" clip-path="url(#tile)"/>
  <rect x="5" y="5" width="54" height="54" rx="14" fill="none" stroke="#1d1a2f" stroke-width="5"/>
</svg>
